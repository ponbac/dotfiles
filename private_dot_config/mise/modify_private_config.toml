{{- /* chezmoi:modify-template */ -}}
{{- $current := dict -}}
{{- if .chezmoi.stdin -}}{{- $current = fromToml .chezmoi.stdin -}}{{- end -}}
{{- /* Keep SDKs per-version so an inherited DOTNET_ROOT cannot select an old SDK. */ -}}
{{- $policy := dict "tools" (dict "bun" (dict "version" "latest" "auto_update" "24h") "dotnet" (dict "version" "latest" "auto_update" "24h")) "tool_alias" (dict "dotnet" "core:dotnet") "settings" (dict "dotnet" (dict "isolated" true)) -}}
{{- includeTemplate "agents/keep-format" (dict "stdin" .chezmoi.stdin "value" (mergeOverwrite $current $policy) "format" "toml") -}}
