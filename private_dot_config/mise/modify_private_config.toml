{{- /* chezmoi:modify-template */ -}}
{{- $current := dict -}}
{{- if .chezmoi.stdin -}}{{- $current = fromToml .chezmoi.stdin -}}{{- end -}}
{{- /* Own only Bun/.NET update policy; preserve other tools, settings and trust. */ -}}
{{- $policy := dict "tools" (dict "bun" (dict "version" "latest" "auto_update" "24h") "dotnet" (dict "version" "latest" "auto_update" "24h")) -}}
{{- includeTemplate "agents/keep-format" (dict "stdin" .chezmoi.stdin "value" (mergeOverwrite $current $policy) "format" "toml") -}}
