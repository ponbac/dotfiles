# Mise pins the release; its postinstall runs the same tag's official installer.
# The installer owns its skills, agent integrations, sidecars and ~/.local/bin copy.
[tools."github:backnotprop/plannotator"]
version = "0.27.24"
asset_pattern = "plannotator-{{ os() }}-{{ arch() }}"
bin = "plannotator"
postinstall = 'python3 "$HOME/.local/share/chezmoi/tools/install-plannotator.py" "$MISE_TOOL_VERSION" "$MISE_TOOL_INSTALL_PATH"'
