# Shared update and cleanup policy. Fast-moving agents opt out of mise's
# release-age wait per tool (minimum_release_age = "0s" in their declarations);
# everything else keeps the default wait. Omarchy's runtime/PATH ownership stays.
[settings]
# Only opted-in shared tools auto-update; never opt host runtimes in globally.
tool_update.global_auto = false
# Omarchy sets auto_prune = false so `mise up` cannot delete a running version.
# Current mise defers removal by prune_after instead, and `mise prune` (run by
# mise-prune.timer) keeps any version a running process was started from.
upgrade.auto_prune = true
upgrade.prune_after = "24h"
